[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/work"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/resume"
  to = "/assets/docs/Kellia_Gatete_Mechanical_RnD_Resume.pdf"
  status = 302
